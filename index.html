<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNC7 Audio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <meta name="theme-color" content="#eab308">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TNC7 Audio">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #03070c;
            background-image: 
                radial-gradient(at 0% 0%, rgba(5, 10, 15, 1) 0, transparent 50%), 
                radial-gradient(at 100% 100%, rgba(2, 5, 8, 1) 0, transparent 50%);
            color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
        }

        input[type=range] {
            display: none;
        }

        .visualizer-container {
            background-color: #050a10;
            position: relative;
            height: 90px;
            width: 100%;
            border-radius: 0.5rem;
            overflow: hidden;
            border: 1px dashed #eab308;
            transition: all 0.3s ease;
        }

        .visualizer-container:hover {
            border-color: #ca8a04;
            background-color: rgba(234, 179, 8, 0.05);
        }

        .visualizer-container.dragover {
            border-color: #facc15;
            background-color: rgba(250, 204, 21, 0.1);
            box-shadow: inset 0 0 20px rgba(250, 204, 21, 0.1);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #ca8a04 0%, #a16207 100%);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(202, 138, 4, 0.2);
        }
        .btn-gradient:hover {
            box-shadow: 0 6px 20px rgba(202, 138, 4, 0.4);
            transform: scale(1.02);
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
        }
        .btn-gradient:active {
            transform: scale(0.98);
        }
        
        .pulse-text {
            animation: pulse-soft 2s infinite;
        }
        
        @keyframes pulse-soft {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #03070c; 
        }
        ::-webkit-scrollbar-thumb {
            background: #111827; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #1f2937; 
        }
        
        .title-font {
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: 0.02em;
        }

        .glowing-panel {
            border: 1px solid rgba(234, 179, 8, 0.2);
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.06), inset 0 0 5px rgba(234, 179, 8, 0.02);
            transition: all 0.3s ease;
        }
        .glowing-panel:hover {
            border-color: rgba(234, 179, 8, 0.35);
            box-shadow: 0 0 18px rgba(234, 179, 8, 0.12), inset 0 0 8px rgba(234, 179, 8, 0.04);
        }

        .main-glowing-panel {
            border: 1px solid rgba(234, 179, 8, 0.25);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 1), 0 0 20px rgba(234, 179, 8, 0.08), inset 0 0 8px rgba(234, 179, 8, 0.03);
            transition: all 0.3s ease;
        }
        .main-glowing-panel:hover {
            border-color: rgba(234, 179, 8, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 1), 0 0 25px rgba(234, 179, 8, 0.15), inset 0 0 12px rgba(234, 179, 8, 0.05);
        }

        @media all and (display-mode: standalone) {
            #install-pwa-btn {
                display: none !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 relative overflow-hidden min-w-[850px]" oncontextmenu="return false;">

    <div class="bg-[#050a10] main-glowing-panel p-4 rounded-xl w-[800px] min-w-[800px] max-w-[800px] shrink-0 relative z-10 mt-2">
        
        <button id="install-pwa-btn" class="absolute top-4 right-4 z-50 bg-[#0a111a] hover:bg-[#111827] text-yellow-500 hover:text-yellow-400 text-[9px] font-mono tracking-widest uppercase font-bold py-1.5 px-3 rounded-md border border-yellow-500/30 shadow-[0_0_10px_rgba(234,179,8,0.1)] glowing-panel transition-all flex items-center space-x-1.5 cursor-pointer">
            <i class="fas fa-desktop"></i>
            <span>Instal</span>
        </button>

        <div class="text-center mb-3 flex flex-col items-center">
            <h1 class="text-4xl font-extrabold title-font mb-1 uppercase">
                <span class="text-red-600 drop-shadow-[0_0_15px_rgba(220,38,38,0.8)]">TNC7</span> 
                <span class="text-gray-100 drop-shadow-[0_0_15px_rgba(243,244,246,0.2)]">AUDIO</span>
            </h1>
            <div class="inline-block px-3 py-0.5 mt-1 rounded-full border border-yellow-500/30 bg-yellow-500/10 text-yellow-400 text-[10px] font-semibold tracking-wider">
                <span class="w-1.5 h-1.5 rounded-full bg-yellow-400 inline-block mr-1.5 animate-pulse"></span>
                SISTEM SIAP
            </div>
        </div>

        <div id="yt-panel" class="bg-[#0a111a] glowing-panel p-3 rounded-lg mb-3 shadow-[0_0_15px_rgba(234,179,8,0.05)] transition-all relative overflow-hidden">
            <div class="absolute inset-0 bg-yellow-500/5 opacity-50 pointer-events-none"></div>
            <div class="relative z-10 flex flex-col gap-2">
                <div class="flex items-center gap-2">
                    <i class="fab fa-youtube text-yellow-500 text-sm"></i>
                    <span class="text-[10px] font-bold text-yellow-400 font-mono tracking-wider">EKSTRAKSI AUDIO YOUTUBE</span>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="yt-url-input" placeholder="Tempel URL YouTube (https://youtu.be/...)" class="flex-1 bg-[#03070c] border border-yellow-500/30 rounded-md px-3 py-1.5 text-[11px] font-mono text-white focus:outline-none focus:border-yellow-500 transition-colors shadow-inner">
                    <button id="yt-fetch-btn" class="bg-gradient-to-r from-yellow-700 to-yellow-600 hover:from-yellow-600 hover:to-yellow-500 text-white text-[10px] font-mono tracking-widest uppercase font-bold py-1.5 px-4 rounded-md transition-all flex items-center justify-center space-x-1.5 shadow-[0_0_10px_rgba(234,179,8,0.3)] shrink-0">
                        <i class="fas fa-bolt"></i>
                        <span>Ekstrak</span>
                    </button>
                </div>
                <div id="yt-status" class="text-[9px] text-yellow-400 font-mono tracking-widest uppercase hidden text-center mt-1 animate-pulse"></div>
            </div>
        </div>

        <div id="drop-area" class="visualizer-container mb-3 cursor-pointer group flex items-center justify-center relative">
            <input type="file" id="audio-file" accept="audio/mpeg, audio/mp3, audio/wav, audio/ogg" class="hidden">
            
            <canvas id="visualizer" class="absolute inset-0 w-full h-full z-10 pointer-events-none opacity-0 transition-opacity duration-300"></canvas>
            
            <div id="upload-prompt" class="text-center z-20 flex flex-col items-center">
                <div class="w-10 h-10 rounded-lg bg-yellow-900/30 border border-yellow-500/40 flex items-center justify-center group-hover:scale-110 transition-transform shadow-[0_0_15px_rgba(234,179,8,0.2)]">
                    <i class="fas fa-cloud-upload-alt text-lg text-yellow-400"></i>
                </div>
            </div>

            <div id="loading-indicator" class="hidden z-20 flex flex-col items-center text-yellow-400">
                <i class="fas fa-circle-notch fa-spin text-2xl mb-1"></i>
                <span id="loading-text" class="text-[10px] font-mono tracking-widest uppercase font-semibold pulse-text">Memproses Audio...</span>
            </div>
        </div>

        <div id="progress-container" class="bg-[#03070c] glowing-panel px-4 py-2 rounded-lg mb-3 flex flex-col gap-1">
            <div class="flex justify-between items-center text-[10px] font-mono text-slate-400 font-bold">
                <span id="current-time">00:00</span>
                <span id="track-status" class="text-yellow-500 tracking-wider uppercase truncate max-w-[500px] text-center">BELUM ADA LAGU</span>
                <span id="total-duration">00:00</span>
            </div>
            <div id="seek-bar" class="w-full py-1.5 cursor-pointer group relative touch-none">
                <div id="seek-track" class="w-full h-2 bg-[#111827] rounded-full relative">
                    <div id="seek-progress" class="h-full bg-yellow-500 w-0 relative rounded-full pointer-events-none">
                        <div id="seek-thumb" class="absolute -right-1.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 bg-white rounded-full shadow-[0_0_8px_rgba(250,204,21,1)] scale-0 group-hover:scale-100 transition-transform duration-200"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="player-controls" class="space-y-3">
            <div class="bg-[#03070c] glowing-panel p-2 rounded-lg flex flex-nowrap items-center justify-between w-full h-[56px]">
                
                <div class="flex flex-nowrap items-center gap-2 shrink-0">
                    <button id="rewind-btn" class="w-[40px] h-[40px] rounded-lg bg-[#181c25] hover:bg-[#1f2937] text-slate-400 hover:text-yellow-400 border border-[#2a3441] hover:border-yellow-500/50 flex items-center justify-center focus:outline-none flex-shrink-0 transition-all shadow-sm group" title="Kembali ke awal">
                        <i class="fas fa-step-backward text-sm group-active:scale-90 transition-transform"></i>
                    </button>
                    <button id="play-btn" class="btn-gradient w-[40px] h-[40px] rounded-lg text-white flex items-center justify-center focus:outline-none flex-shrink-0 group relative">
                        <i class="fas fa-play text-lg ml-1" id="play-icon"></i>
                    </button>
                    
                    <div class="flex flex-col border-l border-[#1f2937] pl-3 w-[100px] shrink-0 justify-center h-[40px] ml-1">
                        <span class="text-[9px] text-yellow-500 font-mono tracking-widest uppercase font-bold leading-none mb-1">BPM TERDETEKSI</span>
                        <div class="flex items-baseline space-x-1 leading-none mt-0.5">
                            <span id="bpm-display" class="text-xl font-bold font-mono text-white drop-shadow-sm leading-none">--</span>
                            <span class="text-[8px] text-slate-500 font-mono tracking-widest uppercase leading-none">BPM</span>
                        </div>
                    </div>

                    <div class="flex flex-col border-l border-[#1f2937] pl-3 w-[85px] shrink-0 justify-center h-[40px]">
                        <span class="text-[9px] text-yellow-500 font-mono tracking-widest uppercase font-bold leading-none mb-1">NADA DASAR</span>
                        <div class="flex items-baseline space-x-1 leading-none mt-0.5">
                            <span id="key-display" class="text-xl font-bold font-mono text-white drop-shadow-sm leading-none">--</span>
                        </div>
                    </div>
                </div>

                <div class="flex flex-nowrap gap-2 items-center shrink-0">
                    <button id="analyze-btn" class="w-[40px] shrink-0 h-[40px] rounded-md bg-transparent hover:bg-[#111827] text-yellow-500 hover:text-yellow-400 text-lg border border-yellow-900 hover:border-yellow-500 transition-all flex items-center justify-center" title="Deteksi BPM & Nada">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    
                    <div class="flex flex-nowrap w-[145px] shrink-0 items-center justify-center gap-2.5 bg-[#050a10] h-[40px] rounded-md border border-[#1f2937] shadow-inner" title="Loudness Units relative to Full Scale">
                        <div class="flex flex-col items-center justify-center h-full">
                            <span class="text-[7px] text-slate-500 font-mono tracking-widest leading-none mb-1 mt-0.5">IN LUFS</span>
                            <span id="lufs-in-display" class="text-[11px] text-slate-400 font-bold font-mono leading-none">--</span>
                        </div>
                        <div class="h-6 w-px bg-[#1f2937]"></div>
                        <div class="flex flex-col items-center justify-center h-full">
                            <span class="text-[7px] text-slate-500 font-mono tracking-widest whitespace-nowrap leading-none mb-1 mt-0.5">OUT LUFS <span class="text-[6px] text-green-500">(-14 YT)</span></span>
                            <span id="lufs-out-display" class="text-[11px] text-yellow-500 font-bold font-mono leading-none">--</span>
                        </div>
                    </div>

                    <button id="mastering-btn" class="w-[105px] shrink-0 h-[40px] rounded-md bg-[#181c25] hover:bg-[#1f2937] text-slate-300 hover:text-white text-[10px] font-mono tracking-widest uppercase font-bold transition-all flex items-center justify-center border border-[#2a3441]">
                        <span id="mastering-text">MASTER: OFF</span>
                    </button>
                    <button id="download-btn" class="w-[95px] shrink-0 h-[40px] rounded-md bg-yellow-600 hover:bg-yellow-500 text-white text-[10px] font-mono tracking-widest uppercase font-bold transition-all flex items-center justify-center space-x-1.5 shadow-lg shadow-yellow-900/20">
                        <i class="fas fa-download"></i>
                        <span>EKSPOR</span>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-[#03070c] glowing-panel p-3 rounded-lg flex flex-col justify-center">
                    <div class="flex justify-between items-center mb-2 border-b border-yellow-500/20 pb-2">
                        <div class="flex items-center space-x-2">
                            <label class="text-[11px] font-bold text-yellow-400 font-mono tracking-wider">TEMPO</label>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button id="reset-tempo" class="w-5 h-5 rounded bg-[#111827] hover:bg-yellow-900/50 flex items-center justify-center text-slate-500 hover:text-yellow-400 transition-colors" title="Atur Ulang Tempo">
                                <i class="fas fa-undo text-[10px]"></i>
                            </button>
                            <span id="tempo-value" class="text-[11px] font-mono font-bold text-white bg-yellow-500/20 px-2 py-0.5 rounded min-w-[45px] text-center border border-yellow-500/30">1.00x</span>
                        </div>
                    </div>
                    
                    <div class="flex flex-nowrap gap-1.5 justify-center" id="tempo-buttons-container">
                        <button class="tempo-btn active-tempo px-2 py-1 rounded-md text-[10px] font-bold bg-yellow-500/20 border border-yellow-500 text-yellow-400 shadow-[0_0_10px_rgba(250,204,21,0.2)] transition-all" data-val="1.0">1.0x</button>
                        <button class="tempo-btn px-2 py-1 rounded-md text-[10px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all" data-val="2.0">2.0x</button>
                        <button class="tempo-btn px-2 py-1 rounded-md text-[10px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all" data-val="3.0">3.0x</button>
                        <button class="tempo-btn px-2 py-1 rounded-md text-[10px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all" data-val="4.0">4.0x</button>
                        <button class="tempo-btn px-2 py-1 rounded-md text-[10px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all" data-val="5.0">5.0x</button>
                    </div>
                </div>

                <div class="bg-[#03070c] glowing-panel p-3 rounded-lg flex flex-col justify-center">
                    <div class="flex justify-between items-center mb-2 border-b border-yellow-500/20 pb-2">
                        <div class="flex items-center space-x-2">
                            <label class="text-[11px] font-bold text-yellow-400 font-mono tracking-wider">PITCH / NADA</label>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button id="reset-pitch" class="w-5 h-5 rounded bg-[#111827] hover:bg-yellow-900/50 flex items-center justify-center text-slate-500 hover:text-yellow-400 transition-colors shadow-sm" title="Atur Ulang Pitch">
                                <i class="fas fa-undo text-[10px]"></i>
                            </button>
                            <span id="pitch-value" class="text-[11px] font-mono font-bold text-white bg-yellow-500/20 px-2 py-0.5 rounded min-w-[45px] text-center border border-yellow-500/30">0</span>
                        </div>
                    </div>
                    
                    <div class="flex flex-nowrap gap-1.5 justify-center" id="pitch-buttons-container">
                        <button class="pitch-btn px-2 py-1 rounded-md text-[10px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all" data-val="-12">-12</button>
                        <button class="pitch-btn px-2 py-1 rounded-md text-[10px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all" data-val="-6">-6</button>
                        <button class="pitch-btn px-2 py-1 rounded-md text-[10px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all" data-val="-2">-2</button>
                        <button class="pitch-btn active-pitch px-2 py-1 rounded-md text-[10px] font-bold bg-yellow-500/20 border border-yellow-500 text-yellow-400 shadow-[0_0_10px_rgba(250,204,21,0.2)] transition-all" data-val="0">0</button>
                        <button class="pitch-btn px-2 py-1 rounded-md text-[10px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all" data-val="2">+2</button>
                        <button class="pitch-btn px-2 py-1 rounded-md text-[10px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all" data-val="6">+6</button>
                        <button class="pitch-btn px-2 py-1 rounded-md text-[10px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all" data-val="12">+12</button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-[#03070c] glowing-panel p-2 rounded-lg flex flex-col justify-center">
                    <div class="flex flex-nowrap gap-2 justify-center w-full h-full" id="mode-buttons-container">
                        <button id="mode-pitch-lock" class="mode-btn active-mode flex-1 py-1.5 rounded-md text-[10px] font-bold bg-yellow-500/20 border border-yellow-500 text-yellow-400 shadow-[0_0_10px_rgba(250,204,21,0.2)] transition-all flex items-center justify-center space-x-1.5">
                            <i class="fas fa-lock"></i>
                            <span>Normal (Kunci)</span>
                        </button>
                        <button id="mode-chipmunk" class="mode-btn flex-1 py-1.5 rounded-md text-[10px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all flex items-center justify-center space-x-1.5">
                            <i class="fas fa-meteor"></i>
                            <span>Tupai</span>
                        </button>
                    </div>
                </div>

                <div class="bg-[#03070c] glowing-panel p-2 rounded-lg flex flex-col justify-center">
                    <div class="flex flex-nowrap gap-1 justify-center w-full h-full items-center" id="fade-buttons-container">
                        <span class="text-[9px] font-bold text-yellow-500 font-mono tracking-wider mr-1">FADE:</span>
                        <button class="fade-btn active-fade flex-1 py-1.5 rounded-md text-[10px] font-bold bg-yellow-500/20 border border-yellow-500 text-yellow-400 shadow-[0_0_10px_rgba(250,204,21,0.2)] transition-all" data-val="0">OFF</button>
                        <button class="fade-btn flex-1 py-1.5 rounded-md text-[10px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all" data-val="3">3s</button>
                        <button class="fade-btn flex-1 py-1.5 rounded-md text-[10px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all" data-val="5">5s</button>
                        <button class="fade-btn flex-1 py-1.5 rounded-md text-[10px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all" data-val="10">10s</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('keydown', function(e) {
            if(e.key === "F12" || 
              (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C")) || 
              (e.ctrlKey && e.key === "U")) {
                e.preventDefault();
                return false;
            }
        });
    </script>

    <script>
        const fileInput = document.getElementById('audio-file');
        const dropArea = document.getElementById('drop-area');
        const uploadPrompt = document.getElementById('upload-prompt');
        const rewindBtn = document.getElementById('rewind-btn');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const tempoValueDisplay = document.getElementById('tempo-value');
        const resetTempoBtn = document.getElementById('reset-tempo');
        const pitchValueDisplay = document.getElementById('pitch-value');
        const resetPitchBtn = document.getElementById('reset-pitch');
        const bpmDisplay = document.getElementById('bpm-display');
        const keyDisplay = document.getElementById('key-display');
        const analyzeBtn = document.getElementById('analyze-btn');
        const downloadBtn = document.getElementById('download-btn');
        const masteringBtn = document.getElementById('mastering-btn');
        const masteringText = document.getElementById('mastering-text');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const loadingIndicator = document.getElementById('loading-indicator');
        const loadingText = document.getElementById('loading-text');

        const ytPanel = document.getElementById('yt-panel');
        const ytUrlInput = document.getElementById('yt-url-input');
        const ytFetchBtn = document.getElementById('yt-fetch-btn');
        const ytStatus = document.getElementById('yt-status');

        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');
        const trackStatusEl = document.getElementById('track-status');
        const seekBar = document.getElementById('seek-bar');
        const seekTrack = document.getElementById('seek-track');
        const seekProgress = document.getElementById('seek-progress');

        let audioContext;
        let audioBuffer;
        let sourceNode;
        let analyserNode;
        let isPlaying = false;
        let startedAt = 0;
        let pausedAt = 0;
        let animationId;
        let originalFileName = "TNC7_Audio";
        let playbackTempo = 1.0; 
        let playbackPitch = 0; 
        let preservePitch = true; 
        let pitchShiftNode = null; 
        let progressInterval = null;
        let isDraggingSeek = false;
        let capYPositionArray = [];
        
        let isMasteringEnabled = false;
        let masterHighPass = null;
        let masterLowShelf = null;
        let masterHighShelf = null;

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        async function cariTautanAudio(cleanUrl, statusEl) {

                `https://api.ryzendesu.vip/api/downloader/ytmp3?url=${encodeURIComponent(cleanUrl)}`,
                `https://api.siputzx.my.id/api/d/ytmp3?url=${encodeURIComponent(cleanUrl)}`,

            ];

            const cariUrlCerdas = (obj) => {
                let res = { url: null, title: "TNC7_Audio" };
                if (!obj) return res;
                try {
                    const str = JSON.stringify(obj);
                    const urlMatch = str.match(/"(https:\/\/[^"]*(?:mp3|m4a|googlevideo\.com|download|ytdl)[^"]*)"/i);
                    if (urlMatch) res.url = urlMatch[1];

                    const titleMatch = str.match(/"(?:title|judul|name)"\s*:\s*"([^"]+)"/i);
                    if (titleMatch) res.title = titleMatch[1];

        async function initAudio(arrayBuffer) {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    Tone.setContext(audioContext);
                }

                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                
                loadingIndicator.classList.add('hidden');
                canvas.style.opacity = '1';
                
                resizeCanvas();
                clearCanvas();
                
                const duration = audioBuffer.duration;
                totalDurationEl.textContent = formatTime(duration);
                currentTimeEl.textContent = "00:00";
                seekProgress.style.width = "0%";

                bpmDisplay.textContent = "...";
                keyDisplay.textContent = "...";
                analyzeBtn.disabled = true;
                setTimeout(() => {
                    calculateBPM(audioBuffer);
                    detectKey(audioBuffer);
                }, 100); 

            } catch (error) {
                console.error("Gagal mendekode:", error);
                loadingIndicator.classList.add('hidden');
                alert("Gagal mendekode berkas audio. Format mungkin tidak didukung.");
            }
        }

        function getClientX(e) {
            if (e.touches && e.touches.length > 0) return e.touches[0].clientX;
            if (e.changedTouches && e.changedTouches.length > 0) return e.changedTouches[0].clientX;
            return e.clientX;
        }

        function updateSeekPosition(e) {
            if (!audioBuffer) return;
            const targetEl = seekTrack || seekBar;
            const rect = targetEl.getBoundingClientRect();
            let clickX = getClientX(e) - rect.left;
            if (clickX < 0) clickX = 0;
            if (clickX > rect.width) clickX = rect.width;
            
            const percentage = clickX / rect.width;
            pausedAt = percentage * audioBuffer.duration;
            currentTimeEl.textContent = formatTime(pausedAt);
            seekProgress.style.width = (percentage * 100) + '%';
        }

        let wasPlayingBeforeDrag = false;

        function handleDragStart(e) {
            if (!audioBuffer) return;
            isDraggingSeek = true;
            wasPlayingBeforeDrag = isPlaying;
            
            if (isPlaying) {
                isPlaying = false;
                if (sourceNode) {
                    sourceNode.stop();
                    sourceNode.dispose();
                    sourceNode = null;
                }
                if (progressInterval) clearInterval(progressInterval);
            }
            
            updateSeekPosition(e);
        }

        function handleDragMove(e) {
            if (isDraggingSeek) {
                if (e.cancelable) e.preventDefault(); 
                updateSeekPosition(e);
            }
        }

        function handleDragEnd(e) {
            if (isDraggingSeek) {
                isDraggingSeek = false;
                updateSeekPosition(e);
                
                if (wasPlayingBeforeDrag) {
                    playAudio();
                } else {
                    currentTimeEl.textContent = formatTime(pausedAt);
                    const percentage = pausedAt / audioBuffer.duration;
                    seekProgress.style.width = (percentage * 100) + '%';
                }
            }
        }

        seekBar.addEventListener('mousedown', handleDragStart);
        document.addEventListener('mousemove', handleDragMove);
        document.addEventListener('mouseup', handleDragEnd);

        function updateRouting() {
            if (!sourceNode) return;
            
            sourceNode.disconnect();
            if (pitchShiftNode) pitchShiftNode.disconnect();
            if (masterLimiter) masterLimiter.disconnect();
            
            let currentNode = sourceNode;
            
            if (lufsFilterInShelf) {
                currentNode.connect(lufsFilterInShelf);
            }
            
            const isPitchShiftNeeded = (playbackTempo !== 1.0 && preservePitch) || playbackPitch !== 0;
            if (isPitchShiftNeeded && pitchShiftNode) {
                currentNode.connect(pitchShiftNode);
                currentNode = pitchShiftNode;
            }
            
            if (isMasteringEnabled && masterHighPass) {
                currentNode.connect(masterHighPass);
                currentNode = masterLimiter;
            }
            
            if (masterFadeNode) {
                currentNode.connect(masterFadeNode);
                currentNode = masterFadeNode;
            }
            
            if (analyserNode) {
                currentNode.connect(analyserNode);
            }
            if (lufsFilterOutShelf) {
                currentNode.connect(lufsFilterOutShelf);
            }
        }

        function updateProgress() {
            if (!isPlaying || !audioBuffer || isDraggingSeek) return;
            const elapsedRealTime = (audioContext.currentTime - startedAt);
            const currentAudioTime = Math.min(pausedAt + (elapsedRealTime * playbackTempo), audioBuffer.duration);
            
            const percentage = (currentAudioTime / audioBuffer.duration) * 100;
            seekProgress.style.width = percentage + '%';
            currentTimeEl.textContent = formatTime(currentAudioTime);

            if (currentAudioTime >= audioBuffer.duration) {
                stopAudio();
            }
        }

        function playAudio() {
            if (!audioBuffer) {
                fileInput.click();
                return;
            }

            if (Tone.context.state !== 'running') {
                Tone.start();
            }

            if (!analyserNode) {
                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = 2048; 
                analyserNode.smoothingTimeConstant = 0.8;
                analyserNode.connect(audioContext.destination);
            }

            if (!pitchShiftNode) {
                pitchShiftNode = new Tone.PitchShift({
                    windowSize: 0.08, 
                    pitch: 0
                });
                
                masterHighPass = new Tone.Filter(20, "highpass");
                masterLowShelf = new Tone.Filter({ type: "lowshelf", frequency: 80, gain: 2.0 });
                masterHighShelf = new Tone.Filter({ type: "highshelf", frequency: 12000, gain: 2.5 });
                
                masterComp1 = new Tone.Compressor({
                    threshold: -20,
                    ratio: 3.0,
                    attack: 0.03,
                    release: 0.15
                });
                
                masterGain = new Tone.Volume(4);
                masterLimiter = new Tone.Limiter(-0.3);
                
                masterHighPass.chain(masterLowShelf, masterHighShelf, masterComp1, masterGain, masterLimiter);
                
                lufsAnalyserIn = audioContext.createAnalyser();
                lufsAnalyserIn.fftSize = 2048;
                lufsAnalyserOut = audioContext.createAnalyser();
                lufsAnalyserOut.fftSize = 2048;

                lufsFilterInShelf = audioContext.createBiquadFilter();
                lufsFilterInShelf.type = "highshelf";
                lufsFilterInShelf.frequency.value = 1500;
                lufsFilterInShelf.gain.value = 4.0;
                
                lufsFilterInPass = audioContext.createBiquadFilter();
                lufsFilterInPass.type = "highpass";
                lufsFilterInPass.frequency.value = 38;

                lufsFilterOutShelf = audioContext.createBiquadFilter();
                lufsFilterOutShelf.type = "highshelf";
                lufsFilterOutShelf.frequency.value = 1500;
                lufsFilterOutShelf.gain.value = 4.0;
                
                lufsFilterOutPass = audioContext.createBiquadFilter();
                lufsFilterOutPass.type = "highpass";
                lufsFilterOutPass.frequency.value = 38;

                lufsFilterInShelf.connect(lufsFilterInPass);
                lufsFilterInPass.connect(lufsAnalyserIn);
                
                lufsFilterOutShelf.connect(lufsFilterOutPass);
                lufsFilterOutPass.connect(lufsAnalyserOut);
            }
            
            if (!masterFadeNode) {
                masterFadeNode = new Tone.Volume(0);
            }

            sourceNode = new Tone.Player({
                url: audioBuffer,
                fadeIn: 0,
                fadeOut: 0
            });
            sourceNode.playbackRate = playbackTempo;
            
            const tempoCompensation = preservePitch ? (-12 * Math.log2(playbackTempo)) : 0;
            pitchShiftNode.pitch = playbackPitch + tempoCompensation;

            updateRouting(); 

            sourceNode.start(0, pausedAt);
            startedAt = audioContext.currentTime; 
            isPlaying = true;
            
            scheduleFadeOut();
            
            playIcon.classList.remove('fa-play', 'ml-1');
            playIcon.classList.add('fa-pause');
            
            sourceNode.onstop = () => {
                if(isPlaying) {
                    stopAudio();
                }
            };

            if(progressInterval) clearInterval(progressInterval);
            progressInterval = setInterval(updateProgress, 100);

            drawVisualizer();
        }

        function stopAudio() {
            if (sourceNode) {
                sourceNode.stop();
                sourceNode.dispose();
                sourceNode = null;
            }
            isPlaying = false;
            pausedAt = 0;
            if(progressInterval) clearInterval(progressInterval);
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play', 'ml-1');
            if(audioBuffer) {
                currentTimeEl.textContent = "00:00";
                seekProgress.style.width = "0%";
            }
            if(animationId) cancelAnimationFrame(animationId);
            clearCanvas();
        }

        function cleanupNodes() {
            if (pitchShiftNode) { pitchShiftNode.dispose(); pitchShiftNode = null; }
            if (masterHighPass) { masterHighPass.dispose(); masterHighPass = null; }
            if (masterLowShelf) { masterLowShelf.dispose(); masterLowShelf = null; }
            if (masterHighShelf) { masterHighShelf.dispose(); masterHighShelf = null; }
            if (masterComp1) { masterComp1.dispose(); masterComp1 = null; }
            if (masterGain) { masterGain.dispose(); masterGain = null; }
            if (masterLimiter) { masterLimiter.dispose(); masterLimiter = null; }
            if (masterFadeNode) { masterFadeNode.dispose(); masterFadeNode = null; }
            if (lufsFilterInShelf) { lufsFilterInShelf.disconnect(); lufsFilterInShelf = null; }
            if (lufsFilterInPass) { lufsFilterInPass.disconnect(); lufsFilterInPass = null; }
            if (lufsFilterOutShelf) { lufsFilterOutShelf.disconnect(); lufsFilterOutShelf = null; }
            if (lufsFilterOutPass) { lufsFilterOutPass.disconnect(); lufsFilterOutPass = null; }
            if (lufsAnalyserIn) { lufsAnalyserIn.disconnect(); lufsAnalyserIn = null; }
            if (lufsAnalyserOut) { lufsAnalyserOut.disconnect(); lufsAnalyserOut = null; }
            if (analyserNode) { analyserNode.disconnect(); analyserNode = null; }
        }

        function pauseAudio() {
            if (sourceNode) {
                sourceNode.stop();
                sourceNode.dispose();
                sourceNode = null;
            }
            const effectiveElapsed = (audioContext.currentTime - startedAt) * playbackTempo;
            pausedAt = Math.min(audioBuffer.duration, pausedAt + effectiveElapsed);
            isPlaying = false;
            if(progressInterval) clearInterval(progressInterval);
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play', 'ml-1');
            if(animationId) cancelAnimationFrame(animationId);
            clearCanvas();
        }

        playBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            if (isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        });

        rewindBtn.addEventListener('click', () => {
            if (!audioBuffer) return;
            
            if (isPlaying) {
                stopAudio();
                playAudio();
            } else {
                pausedAt = 0;
                currentTimeEl.textContent = "00:00";
                seekProgress.style.width = "0%";
                if (masterFadeNode) masterFadeNode.volume.value = 0;
            }
        });

        function setTempo(val) {
            if (isPlaying) {
                const effectiveElapsed = (audioContext.currentTime - startedAt) * playbackTempo;
                pausedAt = Math.min(audioBuffer.duration, pausedAt + effectiveElapsed);
                startedAt = audioContext.currentTime;
            }

            playbackTempo = val;
            tempoValueDisplay.textContent = val.toFixed(2) + 'x';
            
            document.querySelectorAll('.tempo-btn').forEach(btn => {
                if (parseFloat(btn.getAttribute('data-val')) === val) {
                    btn.className = "tempo-btn active-tempo px-2 py-1 rounded-md text-[10px] font-bold bg-yellow-500/20 border border-yellow-500 text-yellow-400 shadow-[0_0_10px_rgba(250,204,21,0.2)] transition-all";
                } else {
                    btn.className = "tempo-btn px-2 py-1 rounded-md text-[10px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all";
                }
            });

            if (sourceNode && pitchShiftNode) {
                sourceNode.playbackRate = val;
                const tempoCompensation = preservePitch ? (-12 * Math.log2(val)) : 0;
                pitchShiftNode.pitch = playbackPitch + tempoCompensation;
                updateRouting();
                scheduleFadeOut();
            }
        }

        document.querySelectorAll('.tempo-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const val = parseFloat(e.currentTarget.getAttribute('data-val'));
                setTempo(val);
            });
        });

        resetTempoBtn.addEventListener('click', () => {
            setTempo(1.0);
        });

        function setPitch(val) {
            playbackPitch = val;
            pitchValueDisplay.textContent = val + ' Semi';
            
            document.querySelectorAll('.pitch-btn').forEach(btn => {
                if (parseFloat(btn.getAttribute('data-val')) === val) {
                    btn.className = "pitch-btn active-pitch px-2 py-1 rounded-md text-[10px] font-bold bg-yellow-500/20 border border-yellow-500 text-yellow-400 shadow-[0_0_10px_rgba(250,204,21,0.2)] transition-all";
                } else {
                    btn.className = "pitch-btn px-2 py-1 rounded-md text-[10px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all";
                }
            });

            if (sourceNode && pitchShiftNode) {
                const tempoCompensation = preservePitch ? (-12 * Math.log2(playbackTempo)) : 0;
                pitchShiftNode.pitch = val + tempoCompensation;
                updateRouting();
            }
        }

        document.querySelectorAll('.pitch-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const val = parseFloat(e.currentTarget.getAttribute('data-val'));
                setPitch(val);
            });
        });

        resetPitchBtn.addEventListener('click', () => {
            setPitch(0);
        });

        const modePitchLock = document.getElementById('mode-pitch-lock');
        const modeChipmunk = document.getElementById('mode-chipmunk');

        modePitchLock.addEventListener('click', () => {
            preservePitch = true;
            modePitchLock.className = "mode-btn active-mode flex-1 py-1.5 rounded-md text-[11px] font-bold bg-yellow-500/20 border border-yellow-500 text-yellow-400 shadow-[0_0_10px_rgba(250,204,21,0.2)] transition-all flex items-center justify-center space-x-1.5";
            modeChipmunk.className = "mode-btn flex-1 py-1.5 rounded-md text-[11px] font-bold bg-[#181c25] border border-[#2a3441] text-slate-400 hover:text-yellow-400 hover:border-yellow-500/50 transition-all flex items-center justify-center space-x-1.5";
            
            if (sourceNode && pitchShiftNode) {
                const tempoCompensation = -12 * Math.log2(playbackTempo);

        function scheduleFadeOut() {
            if (!masterFadeNode || !audioBuffer) return;
            masterFadeNode.volume.cancelScheduledValues(0);
            
            if (fadeOutDuration === 0) {
                masterFadeNode.volume.value = 0;
                return;
            }

            const totalEffectiveDuration = audioBuffer.duration / playbackTempo;
            const absoluteFadeStartTime = totalEffectiveDuration - fadeOutDuration;
            const currentRealTimeElapsed = pausedAt / playbackTempo + (isPlaying ? (audioContext.currentTime - startedAt) : 0);
            
            if (currentRealTimeElapsed < absoluteFadeStartTime) {
                masterFadeNode.volume.value = 0;
                const timeUntilFadeStarts = absoluteFadeStartTime - currentRealTimeElapsed;
                masterFadeNode.volume.setValueAtTime(0, Tone.now() + timeUntilFadeStarts);
                masterFadeNode.volume.linearRampToValueAtTime(-60, Tone.now() + timeUntilFadeStarts + fadeOutDuration);
            } else if (currentRealTimeElapsed < totalEffectiveDuration) {
                const progress = (currentRealTimeElapsed - absoluteFadeStartTime) / fadeOutDuration;
                const currentVol = -60 * progress;
                masterFadeNode.volume.value = currentVol;
                masterFadeNode.volume.linearRampToValueAtTime(-60, Tone.now() + (totalEffectiveDuration - currentRealTimeElapsed));

        function drawVisualizer() {
            if (!isPlaying) return;

            animationId = requestAnimationFrame(drawVisualizer);

            if (lufsAnalyserIn && lufsAnalyserOut) {
                const getAccurateLUFS = (analyser) => {
                    const data = new Float32Array(analyser.fftSize);
                    analyser.getFloatTimeDomainData(data);
                    let sumSquares = 0;
                    for (let i = 0; i < data.length; i++) {
                        sumSquares += data[i] * data[i];
                    }
                    let rms = Math.sqrt(sumSquares / data.length);
                    if (rms < 0.0001) return -70; 
                    return (20 * Math.log10(rms)) - 0.691; 
                };

                let rawIn = getAccurateLUFS(lufsAnalyserIn);
                let rawOut = getAccurateLUFS(lufsAnalyserOut);

                lufsInValue = (lufsInValue * 0.85) + (rawIn * 0.15);
                lufsOutValue = (lufsOutValue * 0.85) + (rawOut * 0.15);

                const displayIn = lufsInValue <= -68 ? "--" : lufsInValue.toFixed(1);
                const displayOut = lufsOutValue <= -68 ? "--" : lufsOutValue.toFixed(1);
                
                document.getElementById('lufs-in-display').textContent = displayIn;
                document.getElementById('lufs-out-display').textContent = displayOut;
                
                const outEl = document.getElementById('lufs-out-display');
                if (lufsOutValue > -13.0) {
                    outEl.className = "text-[10px] text-red-500 font-bold font-mono";
                } else if (lufsOutValue >= -15.0 && lufsOutValue <= -13.0) {
                    outEl.className = "text-[10px] text-green-400 font-bold font-mono";
                } else {
                    outEl.className = "text-[10px] text-yellow-500 font-bold font-mono";
                }
            }

            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyserNode.getByteFrequencyData(dataArray);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const gap = 3;
            const targetBarWidth = 10;
            const numBars = Math.floor((canvas.width + gap) / (targetBarWidth + gap));
            const barWidth = (canvas.width - ((numBars - 1) * gap)) / numBars;
            const step = Math.floor((bufferLength * 0.5) / numBars); 

            if (capYPositionArray.length !== numBars) {
                capYPositionArray = new Array(numBars).fill(0);
            }

            const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
            gradient.addColorStop(0, '#eab308');   
            gradient.addColorStop(0.5, '#ca8a04'); 
            gradient.addColorStop(1, '#a16207');   

            for (let i = 0; i < numBars; i++) {
                let sum = 0;
                for (let j = 0; j < step; j++) {
                    sum += dataArray[(i * step) + j];
                }
                let value = sum / step;
                
                const percent = value / 255;
                const barHeight = percent * (canvas.height - 15);
                
                const x = i * (barWidth + gap);
                const y = canvas.height - barHeight;

                if (barHeight > capYPositionArray[i]) {
                    capYPositionArray[i] = barHeight;
                } else {
                    capYPositionArray[i] -= 1.5; 
                    if (capYPositionArray[i] < 0) capYPositionArray[i] = 0;
                }

                ctx.fillStyle = gradient;
                ctx.shadowBlur = 0; 
                ctx.fillRect(x, y, barWidth, barHeight);

                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#ffffff'; 
                
                const capY = canvas.height - capYPositionArray[i] - 3; 
                ctx.fillRect(x, capY, barWidth, 3); 
            }
        }

        function calculateBPM(buffer) {
            if(!buffer) return;
            
            let offlineContext = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, buffer.length, buffer.sampleRate);
            let source = offlineContext.createBufferSource();
            source.buffer = buffer;

            let lowpass = offlineContext.createBiquadFilter();
            lowpass.type = "lowpass";
            lowpass.frequency.value = 150;

            let highpass = offlineContext.createBiquadFilter();
            highpass.type = "highpass";
            highpass.frequency.value = 40;

            source.connect(lowpass);
            lowpass.connect(highpass);
            highpass.connect(offlineContext.destination);
            source.start(0);

            offlineContext.startRendering().then(function(renderedBuffer) {
                let data = renderedBuffer.getChannelData(0);
                let peaks = getPeaks(data, renderedBuffer.sampleRate);
                let groups = getIntervals(peaks, renderedBuffer.sampleRate);

                if (groups.length > 0) {
                    let top = groups.sort((a, b) => b.count - a.count)[0];
                    let bpm = Math.round(top.tempo);
                    bpmDisplay.textContent = bpm;
                } else {
                    bpmDisplay.textContent = "--";
                }
                analyzeBtn.disabled = false;
            }).catch(function(err) {
                console.error("Kesalahan perhitungan BPM:", err);
                bpmDisplay.textContent = "ERR";
                analyzeBtn.disabled = false;
            });
        }

        function getPeaks(data, sampleRate) {
            let partSize = Math.floor(sampleRate / 2);
            let parts = Math.floor(data.length / partSize);
            let peaks = [];

            for (let i = 0; i < parts; i++) {
                let max = 0;
                let maxIndex = -1;
                for (let j = i * partSize; j < (i + 1) * partSize; j++) {
                    let volume = Math.abs(data[j]);
                    if (volume > max) {
                        max = volume;
                        maxIndex = j;
                    }
                }
                if (maxIndex !== -1) {
                    peaks.push({ position: maxIndex, volume: max });
                }
            }
            
            peaks.sort((a, b) => b.volume - a.volume);
            peaks = peaks.splice(0, Math.floor(peaks.length * 0.5));
            peaks.sort((a, b) => a.position - b.position);
            return peaks;
        }

        function getIntervals(peaks, sampleRate) {
            let groups = [];
            for (let index = 0; index < peaks.length; index++) {
                for (let i = 1; (i < 10) && (index + i < peaks.length); i++) {
                    let peak = peaks[index];
                    let nextPeak = peaks[index + i];
                    let interval = (nextPeak.position - peak.position) / sampleRate;
                    let tempo = (60 / interval);

                    while (tempo < 70) tempo *= 2;
                    while (tempo > 180) tempo /= 2;

                    tempo = Math.round(tempo);

                    let group = groups.find((g) => g.tempo === tempo);
                    if (group) {
                        group.count++;
                    } else {
                        groups.push({ tempo: tempo, count: 1 });
                    }
                }
            }
            return groups;
        }

        const MAJOR_PROFILE = [1.0, 0.1, 0.4, 0.1, 0.7, 0.5, 0.1, 0.8, 0.1, 0.5, 0.2, 0.4];
        const MINOR_PROFILE = [1.0, 0.1, 0.4, 0.7, 0.2, 0.5, 0.1, 0.8, 0.5, 0.1, 0.2, 0.4];
        const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        async function detectKey(buffer) {
            if(!buffer) return;
            try {
                const sampleRate = buffer.sampleRate;
                const durationToAnalyze = Math.min(buffer.duration, 45); 
                const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, sampleRate * durationToAnalyze, sampleRate);
                
                const source = offlineCtx.createBufferSource();
                source.buffer = buffer;
                
                const filter = offlineCtx.createBiquadFilter();
                filter.type = "lowpass";
                filter.frequency.value = 2500;
                
                const analyser = offlineCtx.createAnalyser();
                analyser.fftSize = 16384; 
                analyser.smoothingTimeConstant = 0.5;
                
                source.connect(filter);
                filter.connect(analyser);
                analyser.connect(offlineCtx.destination);
                source.start(0);

                const chroma = new Array(12).fill(0);
                const step = 0.25; 
                
                for (let t = step; t < durationToAnalyze; t += step) {
                    offlineCtx.suspend(t).then(() => {
                        const data = new Float32Array(analyser.frequencyBinCount);
                        analyser.getFloatFrequencyData(data);
                        
                        const nyquist = sampleRate / 2;
                        let frameChroma = new Array(12).fill(0);
                        
                        for (let i = 0; i < data.length; i++) {
                            const freq = i * nyquist / data.length;
                            if (freq < 40 || freq > 2500) continue; 
                            
                            const mag = Math.pow(10, data[i] / 20); 
                            if (mag > 0.01) {
                                const exactPitch = 69 + 12 * Math.log2(freq / 440);
                                const pitchClass = Math.round(exactPitch) % 12;
                                let weight = (freq < 100) ? 0.5 : 1.0;
                                frameChroma[pitchClass] += (mag * weight);
                            }
                        }

                        let frameSum = frameChroma.reduce((a, b) => a + b, 0);
                        if (frameSum > 0) {
                            for (let i = 0; i < 12; i++) chroma[i] += frameChroma[i] / frameSum;
                        }
                        offlineCtx.resume();
                    });
                }
                
                await offlineCtx.startRendering();
                
                const chromaMean = chroma.reduce((a, b) => a + b, 0) / 12;
                const profMajMean = MAJOR_PROFILE.reduce((a, b) => a + b, 0) / 12;
                const profMinMean = MINOR_PROFILE.reduce((a, b) => a + b, 0) / 12;

                const chromaDenom = Math.sqrt(chroma.reduce((acc, val) => acc + Math.pow(val - chromaMean, 2), 0));
                const majDenom = Math.sqrt(MAJOR_PROFILE.reduce((acc, val) => acc + Math.pow(val - profMajMean, 2), 0));
                const minDenom = Math.sqrt(MINOR_PROFILE.reduce((acc, val) => acc + Math.pow(val - profMinMean, 2), 0));

                let results = [];
                for (let shift = 0; shift < 12; shift++) {
                    let covMaj = 0, covMin = 0;
                    for (let i = 0; i < 12; i++) {
                        const profileIdx = (i - shift + 12) % 12;
                        covMaj += (chroma[i] - chromaMean) * (MAJOR_PROFILE[profileIdx] - profMajMean);
                        covMin += (chroma[i] - chromaMean) * (MINOR_PROFILE[profileIdx] - profMinMean);
                    }
                    
                    let corrMajor = covMaj / ((chromaDenom * majDenom) || 1);
                    let corrMinor = covMin / ((chromaDenom * minDenom) || 1);
                    
                    results.push({ name: NOTE_NAMES[shift] + " Maj", root: shift, isMajor: true, score: corrMajor });
                    results.push({ name: NOTE_NAMES[shift] + " Min", root: shift, isMajor: false, score: corrMinor });
                }
                
                results.sort((a, b) => b.score - a.score);
                let bestMatch = results[0];
                
                const cand1 = results[0];
                const cand2 = results[1];
                let isRelative = false;
                if (cand1.isMajor !== cand2.isMajor) {
                    const relRoot1 = cand1.isMajor ? (cand1.root + 9) % 12 : (cand1.root + 3) % 12;
                    if (relRoot1 === cand2.root) isRelative = true;
                }

                if (isRelative && Math.abs(cand1.score - cand2.score) < 0.25) {
                    const getTriadEnergy = (root, isMaj) => {
                        const third = (root + (isMaj ? 4 : 3)) % 12;
                        const fifth = (root + 7) % 12;
                        return (chroma[root] * 1.5) + (chroma[fifth] * 1.2) + (chroma[third] * 1.0);
                    };
                    const energy1 = getTriadEnergy(cand1.root, cand1.isMajor);
                    const energy2 = getTriadEnergy(cand2.root, cand2.isMajor);
                    if ((cand2.isMajor ? energy2 : energy2 * 1.1) > (cand1.isMajor ? energy1 : energy1 * 1.1)) {
                        bestMatch = cand2;
                    }
                }
                keyDisplay.textContent = bestMatch.name || "--";
            } catch (err) {
                console.error("Kesalahan deteksi nada:", err);
                keyDisplay.textContent = "ERR";
            }
        }

                            let originalBpm = bpmDisplay.textContent.trim();
                            let originalKey = keyDisplay.textContent.trim();
                            const suffix = playbackTempo.toFixed(2) + "x";
                            defaultName = `${cleanFileName} ${suffix} ${originalBpm} BPM ${originalKey} TNC7 Audio.mp3`;
                        }
                        
                        defaultName = defaultName.replace(/\s+/g, " ").trim();

                        const isIframe = window.self !== window.top;
                        
                        // Sistem pemilihan folder bawaan (showSaveFilePicker API). 
                        // Peramban akan otomatis menampilkan jendela dialog OS untuk memilih letak/folder penyimpanan.
                        if (window.showSaveFilePicker && !isIframe) {
                            try {
                                const handle = await window.showSaveFilePicker({
                                    suggestedName: defaultName,
                                    types: [{ description: 'Berkas Audio MP3', accept: {'audio/mpeg': ['.mp3']} }],
                                });
                                const writable = await handle.createWritable();
                                await writable.write(blob);
                                await writable.close();
                            } catch (err) {
                                if (err.name !== 'AbortError') fallbackDownload(blob, defaultName);
                            }
                        } else {
                            fallbackDownload(blob, defaultName);
                        }
                        downloadBtn.disabled = false;
                        downloadBtn.innerHTML = `<i class="fas fa-download"></i><span>EKSPOR</span>`;

                    } catch (err) {
                        console.error("Kesalahan pengkodean ekspor:", err);
                        alert("Gagal mengonversi audio ke MP3.");
                        downloadBtn.disabled = false;
                        downloadBtn.innerHTML = `<i class="fas fa-download"></i><span>EKSPOR</span>`;
                    }
                }, 50);

            } catch (err) {
                clearInterval(progressTimer);
                console.error("Kesalahan render offline:", err);
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = `<i class="fas fa-download"></i><span>EKSPOR</span>`;
                alert("Gagal merender audio. Silakan coba lagi.");
            }
        });

        function fallbackDownload(blob, filename) {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function encodeAudioBufferToMp3(buffer) {
            const channels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const kbps = 192;
            const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
            const mp3Data = [];

            const samples = buffer.length;
            const left = buffer.getChannelData(0);
            const right = channels > 1 ? buffer.getChannelData(1) : left;

            const sampleBlockSize = 1152;
            const leftInt16 = new Int16Array(samples);
            const rightInt16 = new Int16Array(samples);
            for (let i = 0; i < samples; i++) {
                leftInt16[i] = Math.max(-1, Math.min(1, left[i])) * 32767;
                rightInt16[i] = Math.max(-1, Math.min(1, right[i])) * 32767;
            }

            for (let i = 0; i < samples; i += sampleBlockSize) {
                const leftChunk = leftInt16.subarray(i, i + sampleBlockSize);
                const rightChunk = rightInt16.subarray(i, i + sampleBlockSize);
                
                const mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
                if (mp3buf.length > 0) {
                    mp3Data.push(mp3buf);
                }
            }
            
            const mp3buf = mp3encoder.flush();
            if (mp3buf.length > 0) {
                mp3Data.push(mp3buf);
            }
            
            return new Blob(mp3Data, { type: 'audio/mpeg' });
        }

        setTimeout(resizeCanvas, 100);

        (function initPWA() {
            let deferredPrompt;
            const installBtn = document.getElementById('install-pwa-btn');

            const manifestJSON = {
                "name": "TNC7 Audio",
                "short_name": "TNC7",
                "start_url": window.location.pathname, 
                "display": "standalone",
                "background_color": "#03070c",
                "theme_color": "#eab308",
                "icons": [
                    { "src": "https://placehold.co/192x192/eab308/000000?text=TNC7", "sizes": "192x192", "type": "image/png" },
                    { "src": "https://placehold.co/512x512/eab308/000000?text=TNC7", "sizes": "512x512", "type": "image/png" }
                ]
            };
            
            const manifestDataUrl = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestJSON));
            const manifestLink = document.createElement('link');
            manifestLink.rel = 'manifest';
            manifestLink.href = manifestDataUrl;
            document.head.appendChild(manifestLink);

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault(); 
                deferredPrompt = e; 
            });

            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') installBtn.classList.add('hidden');
                    deferredPrompt = null;
                } else {
                    showInstallGuide();
                }
            });

            function showInstallGuide() {
                const existing = document.getElementById('pwa-guide-modal');
                if(existing) existing.remove();

                const modal = document.createElement('div');
                modal.id = 'pwa-guide-modal';
                modal.className = 'fixed inset-0 z-[100] flex items-center justify-center bg-[#000000] bg-opacity-80 backdrop-blur-sm transition-opacity';
                
                const isEdge = navigator.userAgent.indexOf("Edg") > -1;
                const menuIcon = isEdge ? "••• (Titik Tiga Horizontal)" : "⋮ (Titik Tiga Vertikal)";
                const menuText = isEdge ? "Aplikasi > Instal situs ini sebagai aplikasi" : "Simpan dan Bagikan > Instal halaman sebagai aplikasi";

                modal.innerHTML = `
                    <div class="bg-[#050a10] border border-yellow-500/30 shadow-[0_0_40px_rgba(234,179,8,0.15)] p-6 rounded-xl w-[450px] text-center main-glowing-panel relative">
                        <div class="w-12 h-12 mx-auto bg-yellow-900/30 rounded-full flex items-center justify-center mb-3 border border-yellow-500/50 shadow-[0_0_15px_rgba(234,179,8,0.2)]">
                            <i class="fas fa-desktop text-xl text-yellow-400"></i>
                        </div>
                        <h3 class="text-white font-bold tracking-widest mb-1 text-lg">PANDUAN INSTALASI</h3>
                        <p class="text-slate-400 text-[11px] mb-4 font-mono leading-relaxed px-2">
                            Keamanan peramban membatasi pop-up otomatis. Anda <b class="text-white">tetap dapat memasangnya</b> melalui menu peramban:
                        </p>
                        <div class="bg-[#03070c] rounded-lg p-4 border border-[#1f2937] text-left mb-5">
                            <ol class="text-[11px] font-mono text-slate-300 space-y-2 list-decimal list-inside">
                                <li>Klik ikon Menu <span class="text-yellow-400 font-bold">${menuIcon}</span> di sudut kanan atas.</li>
                                <li>Pilih opsi <span class="text-yellow-400 font-bold">"${menuText}"</span>.</li>
                                <li>Klik <span class="text-yellow-400 font-bold">Instal</span>.</li>
                            </ol>
                        </div>
                        <button id="close-guide-btn" class="btn-gradient w-full py-2.5 rounded-md text-white text-[11px] font-mono tracking-widest uppercase font-bold flex justify-center items-center gap-2">
                            <i class="fas fa-check"></i> Saya Mengerti
                        </button>
                    </div>
                `;
                document.body.appendChild(modal);
                document.getElementById('close-guide-btn').addEventListener('click', () => modal.remove());
            }
        })();
    </script>
